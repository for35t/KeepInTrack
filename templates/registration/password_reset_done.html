{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 text-center">
  <h1 class="font-display text-2xl font-bold">Check your email</h1>
  <p class="text-sm text-zinc-400 mt-3 leading-relaxed">
    If an account exists with that address, we've sent a reset link.
    It may take a minute to arrive — check your spam folder too.</p>
  <p class="text-sm text-zinc-500 mt-8">
    <a href="{% url 'login' %}" class="text-violet-400 hover:text-violet-300 transition-colors">Back to log in</a>
  </p>
</div>
{% endblock %}
