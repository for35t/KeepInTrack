{% extends "base.html" %}
{% block title %}Sign up{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold">Sign up</h1>

<form method="post" class="mt-6 max-w-sm space-y-4">
  {% csrf_token %}

  {% for field in form %}
    <div>
      <label class="block text-sm text-zinc-400 mb-1">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}
        <p class="text-sm text-red-400 mt-1">{{ error }}</p>
      {% endfor %}
    </div>
  {% endfor %}

  <button type="submit"
          class="bg-zinc-100 text-zinc-900 rounded px-4 py-2 text-sm font-medium">Create account</button>
</form>

<p class="text-sm text-zinc-500 mt-6">
  Already have an account?
  <a href="{% url 'login' %}" class="underline hover:text-zinc-300">Log in</a>
</p>
{% endblock %}
