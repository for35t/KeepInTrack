{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10">
  <h1 class="font-display text-2xl font-bold text-center">Reset your password</h1>
  <p class="text-sm text-zinc-500 text-center mt-2">
    Enter your email and we'll send you a link to choose a new one.</p>

  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-xs uppercase tracking-widest text-zinc-500 mb-2">Email</label>
      <input type="email" name="email" required autocomplete="off"
             class="w-full bg-black/60 border border-zinc-900 rounded-lg px-3 py-2.5 text-sm
                    outline-none focus:border-violet-500/60 transition-colors">
    </div>
    <button type="submit"
            class="w-full bg-violet-500 hover:bg-violet-400 text-white rounded-lg px-4 py-2.5 text-sm font-medium transition-colors">
      Send reset link</button>
  </form>

  <p class="text-sm text-zinc-500 mt-8 text-center">
    <a href="{% url 'login' %}" class="text-violet-400 hover:text-violet-300 transition-colors">Back to log in</a>
  </p>
</div>
{% endblock %}
