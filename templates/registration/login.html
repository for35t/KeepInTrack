{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold">Log in</h1>

<form method="post" class="mt-6 max-w-sm space-y-4">
  {% csrf_token %}

  {% if form.errors %}
    <p class="text-sm text-red-400">Incorrect username or password.</p>
  {% endif %}

  <div>
    <label class="block text-sm text-zinc-400 mb-1">Username</label>
    {{ form.username }}
  </div>

  <div>
    <label class="block text-sm text-zinc-400 mb-1">Password</label>
    {{ form.password }}
  </div>

  <button type="submit"
          class="bg-zinc-100 text-zinc-900 rounded px-4 py-2 text-sm font-medium">Log in</button>
</form>

<p class="text-sm text-zinc-500 mt-6">
  No account?
  <a href="{% url 'signup' %}" class="underline hover:text-zinc-300">Sign up</a>
</p>

{% endblock %}
