{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 text-center">
  <h1 class="font-display text-2xl font-bold">Password changed</h1>
  <p class="text-sm text-zinc-400 mt-3">You can log in with your new password now.</p>
  <a href="{% url 'login' %}"
     class="inline-block mt-8 bg-violet-500 hover:bg-violet-400 text-white rounded-lg px-5 py-2.5 text-sm font-medium transition-colors">
    Log in</a>
</div>
{% endblock %}
