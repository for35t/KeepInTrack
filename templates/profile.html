{% extends "base.html" %}
{% block title %}{{ user.username }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold">{{ user.username }}</h1>
<p class="text-sm text-zinc-500 mt-1">Joined {{ user.date_joined|date:"F Y" }}</p>

<div class="mt-8 border border-zinc-800 rounded p-4">
  <p class="text-sm text-zinc-400">
    Following {{ user.follows.count }} show{{ user.follows.count|pluralize }}
  </p>
  <a href="{% url 'my_shows' %}" class="text-sm underline text-zinc-500 hover:text-zinc-300">View list</a>
</div>
{% endblock %}
