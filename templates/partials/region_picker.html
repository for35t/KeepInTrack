<div x-data="{ open: false, up: false }" class="relative">
  <button type="button"
          @click="up = $el.getBoundingClientRect().bottom + 300 > window.innerHeight; open = !open"
          class="text-sm px-3 py-1.5 rounded-lg bg-black/60 border border-zinc-900 text-zinc-400 hover:text-zinc-200 hover:border-zinc-700 transition-colors whitespace-nowrap">
    {{ label }}
    <span class="text-zinc-600 ml-1 text-xs" x-text="up ? '▴' : '▾'">▾</span>
  </button>

  <div x-show="open" @click.outside="open = false" x-cloak
       :class="up ? 'bottom-full mb-2' : 'top-full mt-2'"
       class="absolute left-0 z-30 min-w-max max-w-xs rounded-lg bg-black border border-zinc-900 shadow-2xl shadow-black/80 overflow-hidden">
    <form method="post" action="{% url 'set_region' %}"
          hx-post="{% url 'set_region' %}"
          hx-target="#watch-section"
          hx-swap="innerHTML"
          class="filterlist max-h-72 overflow-y-auto">
      {% csrf_token %}
      <input type="hidden" name="tmdb_id" value="{{ tmdb_id }}">
      <input type="hidden" name="media_type" value="{{ media_type }}">
      {% for code, name in regions %}
        <button type="submit" name="region" value="{{ code }}" @click="open = false"
                class="flex items-center justify-between gap-4 w-full text-left px-4 py-2.5 text-sm border-b border-zinc-900 last:border-b-0 transition-colors
                       {% if code == region %}text-violet-300 bg-zinc-950{% else %}text-zinc-500 hover:text-zinc-200 hover:bg-zinc-950{% endif %}">
          <span class="truncate">{{ name }}</span>
          {% if code == region %}<span class="text-xs shrink-0">✓</span>{% endif %}
        </button>
      {% endfor %}
    </form>
  </div>
</div>
