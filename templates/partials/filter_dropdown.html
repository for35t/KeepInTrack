<div x-data="{ open: false, up: false }" class="relative">
  <button type="button" @click="up = $el.getBoundingClientRect().bottom + 300 > window.innerHeight; open = !open"
          class="text-sm px-3 py-1.5 rounded-lg bg-black/60 border border-zinc-900 text-zinc-400 hover:text-zinc-200 hover:border-zinc-700 transition-colors whitespace-nowrap">
    {{ label }}{% if count %} <span class="text-violet-400">({{ count }})</span>{% endif %}
    <span class="text-zinc-600 ml-1 text-xs">▾</span>
  </button>

    <div x-show="open" @click.outside="open = false" x-cloak
       :class="up ? 'bottom-full mb-2' : 'top-full mt-2'"
       class="absolute left-0 z-30 min-w-max max-w-xs rounded-lg bg-black border border-zinc-900 shadow-2xl shadow-black/80 overflow-hidden">
    <div class="filterlist max-h-72 overflow-y-auto">
      {% for option in options %}
        <a href="{{ option.url }}"
           class="flex items-center justify-between gap-4 px-4 py-2.5 text-sm border-b border-zinc-900 last:border-b-0 transition-colors
                  {% if option.active %}text-violet-300 bg-zinc-950{% else %}text-zinc-500 hover:text-zinc-200 hover:bg-zinc-950{% endif %}">
          <span class="truncate">{{ option.label }}</span>
          {% if option.active %}<span class="text-xs shrink-0">✓</span>{% endif %}
        </a>
      {% endfor %}
    </div>
  </div>
</div>
