{% extends "base.html" %}
{% block title %}Explore{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold">Explore</h1>

<form method="get" class="mt-6 flex gap-2 items-center max-w-4xl">
  <input type="text" name="q" value="{{ query }}" placeholder="Search TV shows…"
         hx-get="{% url 'explore' %}"
         hx-trigger="input changed delay:300ms"
         hx-target="#explore-results"
         hx-swap="innerHTML"
         hx-indicator="#search-spinner"
         class="flex-1 bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-sm outline-none focus:border-zinc-600">
  <span id="search-spinner" class="htmx-indicator text-xs text-zinc-500">searching…</span>
</form>

<div id="explore-results">
  {% include "partials/explore_results.html" %}
</div>
{% endblock %}
