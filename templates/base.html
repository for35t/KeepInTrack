{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tracker{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <nav class="border-b border-zinc-800">
    <div class="max-w-4xl mx-auto px-4 flex gap-6 items-center h-14 text-sm">
      <span class="font-semibold mr-2">Tracker</span>

      <a href="{% url 'home' %}"
         class="{% if request.resolver_match.url_name == 'home' %}text-white{% else %}text-zinc-500 hover:text-zinc-300{% endif %}">Home</a>

      <a href="{% url 'explore' %}"
         class="{% if request.resolver_match.url_name == 'explore' %}text-white{% else %}text-zinc-500 hover:text-zinc-300{% endif %}">Explore</a>

      <a href="{% url 'my_shows' %}"
         class="{% if request.resolver_match.url_name == 'my_shows' %}text-white{% else %}text-zinc-500 hover:text-zinc-300{% endif %}">My Shows</a>

      <a href="{% url 'profile' %}"
         class="ml-auto {% if request.resolver_match.url_name == 'profile' %}text-white{% else %}text-zinc-500 hover:text-zinc-300{% endif %}">Profile</a>

      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-zinc-500 hover:text-zinc-300">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="text-zinc-500 hover:text-zinc-300">Log in</a>
      {% endif %}
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
  </main>


    <footer class="border-t border-zinc-800 mt-16">
    <div class="max-w-4xl mx-auto px-4 py-6 flex items-center gap-3 text-xs text-zinc-500">
      <img src="{% static 'tracker/tmdb-logo.svg' %}" alt="TMDB" class="h-4">
      <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
    </div>
  </footer>
</body>
</html>
